<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FFT Ocean — Claude (WebGPU)</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f14; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 10px; left: 12px; z-index: 10;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cfe6ff; white-space: pre; pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
    }
    body.shot #hud { display: none; } /* capture mode: clean frame, errors still show */
    #err {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; display: none;
      font: 12px/1.5 ui-monospace, monospace; color: #ffd7d7;
      background: rgba(60,0,0,0.84); border: 1px solid #a33; border-radius: 6px;
      padding: 10px 12px; white-space: pre-wrap; max-height: 42vh; overflow: auto;
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
